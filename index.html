<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bligh Group Advisory — Commercial, Legal, Projects.">
  <title>Bligh Group Advisory | Coming Soon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="title">

      <header class="brand">
        <img src="bligh-logo.png" alt="Bligh">
        <div class="brand-subtitle">GROUP ADVISORY</div>
      </header>

      <div class="content">
        <p class="eyebrow">COMING SOON</p>
        <h1 id="title">Commercial. Legal. Projects.</h1>
        <p class="intro">
          Independent legal and commercial advisory for complex projects and strategic contracting.
        </p>
      </div>

      <div class="contact">
        <h2>Contact us</h2>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <input type="hidden" name="_subject" value="BGA website enquiry">
          <button type="submit">Send enquiry</button>
        </form>
      </div>

      <footer>Brisbane · Australia</footer>
    </section>
  </main>
</body>
</html>
